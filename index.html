<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Smart Spray Warning System — แบบฝึกเทียบเคียง PISA 2025 (LDW)</title>
<style>
  :root{
    --bg:#F4F7EC;
    --surface:#FFFFFF;
    --surface2:#EEF3E2;
    --surface3:#E3EBD3;
    --line:#D7E2C3;
    --leaf:#3FA34D;
    --leaf-dim:#2E7D3B;
    --leaf-soft:#E4F3E2;
    --spray:#FF7A33;
    --spray-dim:#C85A1E;
    --spray-soft:#FFE8D6;
    --amber:#F2A93D;
    --amber-soft:#FCEFD9;
    --green:#2E7D4F;
    --green-soft:#E3F3E7;
    --red:#D64545;
    --red-soft:#FBE4E1;
    --text:#1B2415;
    --muted:#3E4C37;
    --muted-dim:#66765B;
    --radius:14px;
    --radius-sm:8px;
    font-size:19px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% -10%, #EAF3DA 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #FCEFD9 0%, transparent 42%),
      var(--bg);
    color:var(--text);
    font-family:'Sarabun','Segoe UI','Noto Sans Thai','TH Sarabun New',Tahoma,sans-serif;
    font-weight:500;
    min-height:100vh;
    line-height:1.55;
  }
  #app{max-width:1000px;margin:0 auto;padding:0 18px 60px;}
  a{color:var(--leaf-dim);}

  /* ---------- top status bar ---------- */
  .statusbar{
    position:sticky;top:0;z-index:50;
    background:rgba(244,247,236,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 0 14px;
    margin-bottom:26px;
  }
  .statusbar-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:10px;}
  .identity{display:flex;align-items:center;gap:10px;}
  .identity-badge{
    width:38px;height:38px;border-radius:50%;
    background:var(--leaf-soft);border:1px solid var(--leaf);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--leaf-dim);flex-shrink:0;
  }
  .identity-name{font-weight:600;font-size:0.95rem;}
  .identity-grade{font-size:0.88rem;color:var(--muted);}
  .timerbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);padding:7px 14px;border-radius:999px;}
  .timerbox .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;}
  .timerbox.warn .dot{background:var(--red);}
  .timerbox .t{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0.5px;color:var(--text);}
  .timerbox.warn .t{color:var(--red);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  /* ---------- stepper ---------- */
  .lanewrap{margin-top:14px;position:relative;height:34px;}
  .laneline{
    position:absolute;top:16px;left:0;right:0;height:2px;
    background-image:repeating-linear-gradient(to right, var(--muted-dim) 0 14px, transparent 14px 26px);
  }
  .lanesteps{position:relative;display:flex;justify-content:space-between;}
  .lanestep{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);padding:0 6px;position:relative;z-index:2;}
  .lanestep .pip{width:14px;height:14px;border-radius:50%;background:var(--surface2);border:2px solid var(--muted-dim);}
  .lanestep.done .pip{background:var(--green);border-color:var(--green);}
  .lanestep.active .pip{background:var(--leaf);border-color:var(--leaf);box-shadow:0 0 0 5px var(--leaf-soft);}
  .lanestep .lbl{font-size:0.84rem;color:var(--muted);letter-spacing:0.3px;}
  .lanestep.active .lbl{color:var(--leaf-dim);font-weight:700;}
  .lanestep.done .lbl{color:var(--green);}

  /* ---------- layout blocks ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 24px;margin-bottom:20px;
    box-shadow:0 1px 2px rgba(40,60,20,0.05), 0 10px 24px rgba(40,60,20,0.05);}
  .eyebrow{color:var(--leaf-dim);font-size:0.9rem;font-weight:700;margin:0 0 6px;}
  h1{font-size:1.7rem;margin:0 0 10px;font-weight:700;color:var(--text);}
  h2{font-size:1.28rem;margin:0 0 12px;font-weight:700;color:var(--text);}
  h3{font-size:1.05rem;margin:0 0 8px;font-weight:700;color:var(--text);}
  p{color:#1F2A19;margin:0 0 12px;}
  .muted{color:var(--muted);}
  .hero{
    border-radius:var(--radius);
    padding:30px 28px;
    margin-bottom:22px;
    background:linear-gradient(135deg, #EAF3DA 0%, #F7F2E2 55%, #FDEFDD 100%);
    border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  @media(min-width:641px){ .hero{ padding-right:172px; } }
  .hero-graphic{
    position:absolute;top:18px;right:20px;width:142px;height:142px;z-index:1;
    filter:drop-shadow(0 8px 14px rgba(60,80,30,0.18));
  }
  @media(max-width:640px){ .hero-graphic{ display:none; } }

  label{display:block;font-size:0.94rem;color:var(--muted);margin-bottom:6px;font-weight:600;}
  input[type=text], select, input[type=number], textarea{
    width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:var(--radius-sm);font-size:0.95rem;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  input[type=range]{width:100%;accent-color:var(--leaf);}
  .field{margin-bottom:16px;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  button{
    font-family:inherit;font-size:0.92rem;font-weight:700;cursor:pointer;
    border-radius:999px;padding:11px 22px;border:1px solid transparent;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--leaf);color:#FFFFFF;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{background:var(--surface3);color:var(--muted-dim);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--muted-dim);}
  .btn-sm{padding:7px 14px;font-size:0.9rem;}

  .choice{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius-sm);margin-bottom:9px;cursor:pointer;background:var(--surface2);
  }
  .choice:hover{border-color:var(--muted-dim);}
  .choice.selected{border-color:var(--leaf);background:var(--leaf-soft);}
  .choice input{margin-top:3px;accent-color:var(--leaf);}
  .qnum{display:inline-block;background:var(--surface3);color:var(--leaf-dim);font-weight:700;font-size:0.86rem;padding:3px 9px;border-radius:6px;margin-bottom:10px;}

  table{width:100%;border-collapse:collapse;font-size:0.95rem;margin:14px 0;}
  th,td{text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:0.88rem;text-transform:none;}
  tr:hover td{background:rgba(63,163,77,0.04);}
  .ok{color:var(--green);font-weight:700;}
  .bad{color:var(--red);font-weight:700;}

  .paramgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.paramgrid{grid-template-columns:1fr;}}
  .metric{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;text-align:center;}
  .metric .num{font-size:1.6rem;font-weight:800;color:var(--leaf-dim);}
  .metric .lbl{font-size:0.88rem;color:var(--muted);margin-top:3px;}

  .barrow{margin-bottom:16px;}
  .barrow .toprow{display:flex;justify-content:space-between;font-size:0.94rem;margin-bottom:6px;}
  .bartrack{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;}
  .barfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#3FA34D,#FF7A33);}

  .levelbadge{
    display:inline-flex;align-items:center;gap:10px;padding:16px 22px;border-radius:var(--radius);
    border:1px solid var(--leaf); background:var(--leaf-soft);margin:6px 0 18px;
  }
  .levelbadge .lv{font-size:2rem;font-weight:800;color:var(--leaf-dim);}
  .likert{display:flex;gap:8px;margin-top:6px;}
  .likert button{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:10px 6px;font-size:0.9rem;}
  .likert button.sel{background:var(--leaf);color:#fff;border-color:var(--leaf);}

  .footer-nav{display:flex;justify-content:space-between;margin-top:8px;}
  .small{font-size:0.92rem;color:var(--muted);}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .historytable{overflow-x:auto;}
  code{background:var(--surface3);padding:2px 6px;border-radius:5px;font-size:0.85em;}

  /* ---------- flowchart builder (Task 1) ---------- */
  .flowbuilder{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:720px){.flowbuilder{grid-template-columns:1fr;}}
  .flowcards .flowcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface2);margin-bottom:8px;}
  .flowcards select{width:64px;flex-shrink:0;padding:6px;}
  .flowcards .desc{font-size:0.92rem;color:var(--text);}
  .flowchart-preview{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);}
  .fnode{width:92%;padding:9px 10px;font-size:0.84rem;text-align:center;color:#1c2618;font-weight:600;position:relative;}
  .fnode.start-end{background:var(--surface3);border-radius:999px;border:1px solid var(--muted-dim);}
  .fnode.process{background:var(--leaf-soft);border:1px solid var(--leaf);border-radius:4px;}
  .farrow{width:2px;height:14px;background:var(--muted-dim);}
  .flownote{font-size:0.84rem;color:var(--muted);background:var(--surface2);border:1px dashed var(--muted-dim);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px;}
  .flownote b{color:var(--text);}

  /* ---------- shared: task rule banner / metric grid / drag ghost ---------- */
  .ruleline{font-size:0.9rem;background:var(--amber-soft);border:1px solid #F3D3A0;border-radius:var(--radius-sm);padding:9px 12px;margin:0 0 14px;color:#5A4520;}
  .metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .drag-ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0.92;transform:rotate(2deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,0.22));}
  .bpanel-title{font-size:0.88rem;font-weight:700;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}

  /* ---------- block coding IDE (Task 2 · Scratch-like) ---------- */
  .blockide{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start;}
  @media(max-width:720px){.blockide{grid-template-columns:minmax(0,1fr);}}
  .blockide > *, .stagewrap > *, .drawide > *{min-width:0;}
  .bpanel{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;}
  .bcat{font-size:0.82rem;font-weight:700;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:6px;}
  .bcat:first-of-type{margin-top:0;}
  .bcat i{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .bpalette .sblock{margin-bottom:6px;padding-right:12px;}
  .scriptarea{min-height:420px;background-color:#FBFCF7;background-image:radial-gradient(#DCE5CE 1px, transparent 1px);background-size:16px 16px;}
  .scriptarea .sblock{width:fit-content;min-width:230px;max-width:100%;}
  .script-empty{font-size:0.9rem;color:var(--muted-dim);text-align:center;padding:34px 12px;border:2px dashed var(--line);border-radius:var(--radius-sm);margin-top:4px;}
  .sblock{position:relative;display:block;color:#fff;font-size:0.86rem;font-weight:700;line-height:1.45;padding:8px 30px 8px 12px;border-radius:6px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,0.15);}
  .sblock:active{cursor:grabbing;}
  .sb-event{background:#FFBF00;color:#3A2A00;}
  .sb-control{background:#FFAB19;color:#3A2400;}
  .sb-sensing{background:#5CB1D6;}
  .sb-looks{background:#9966FF;}
  .sb-motion{background:#4C97FF;}
  .sb-hat{border-radius:22px 22px 6px 6px;padding-top:14px;}
  .sb-cblock{padding:0;}
  .sb-cblock > .sb-head{padding:8px 30px 8px 12px;}
  .sb-cblock > .sb-mouth{margin-left:16px;background:#FBFCF7;min-height:28px;padding:3px 0;border-radius:0 6px 6px 0;box-shadow:inset 2px 0 0 rgba(0,0,0,0.08);}
  .bpalette .sb-cblock > .sb-mouth{background:var(--surface2);min-height:14px;}
  .sb-cblock > .sb-foot{height:14px;}
  .sb-cond{display:inline-block;background:rgba(255,255,255,0.45);border-radius:12px;padding:1px 9px;margin:0 2px;}
  .sb-str{display:inline-block;background:#fff;color:#3A3A3A;border-radius:10px;padding:1px 8px;margin:0 2px;font-weight:600;}
  .sb-flag{color:#2E9E4A;font-size:0.95rem;}
  .sb-del{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,0.22);color:#fff;font-size:0.84rem;line-height:18px;padding:0;cursor:pointer;}
  .sb-del:hover{background:rgba(0,0,0,0.42);}
  .bslot{height:6px;border-radius:3px;transition:height .08s ease;}
  .bslot.active{height:18px;background:rgba(76,151,255,0.22);outline:2px dashed #4C97FF;outline-offset:-2px;}
  .sblock.drag-src{opacity:0.3;}
  .stagewrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;margin-top:16px;align-items:start;}
  @media(max-width:720px){.stagewrap{grid-template-columns:minmax(0,1fr);}}
  .stage{position:relative;height:180px;border-radius:var(--radius-sm);border:1px solid var(--line);overflow:hidden;background:linear-gradient(180deg,#DDEFFB 0%,#F1F8EA 60%,#CFE6B5 60%,#B5D897 100%);}
  .stage-sprite{position:absolute;bottom:14px;width:78px;height:78px;transition:left .5s ease;}
  .stage-bubble{position:absolute;left:96px;top:26px;right:10px;background:#fff;border:2px solid #C9D4BE;border-radius:14px;padding:8px 10px;font-size:0.86rem;font-weight:700;color:var(--text);}
  .stage-bubble::after{content:'';position:absolute;left:-12px;bottom:12px;border-width:7px 12px 7px 0;border-style:solid;border-color:transparent #C9D4BE transparent transparent;}
  .stage-bubble.err{border-color:var(--red);color:var(--red);}
  .stage-bubble.ok{border-color:var(--green);color:var(--green);}
  .stage-label{position:absolute;left:8px;top:6px;font-size:0.8rem;color:var(--muted);font-weight:700;}
  .runtable td,.runtable th{font-size:0.86rem;padding:7px 5px;}
  .runtable td:first-child{text-align:left;}
  .runbtn{padding:5px 11px;font-size:0.84rem;white-space:nowrap;}

  /* ---------- flowchart editor (Task 3 · draw.io-like) ---------- */
  .drawide{display:grid;grid-template-columns:178px minmax(0,1fr);gap:12px;align-items:start;}
  @media(max-width:720px){.drawide{grid-template-columns:minmax(0,1fr);} .dpalette{display:flex;flex-wrap:wrap;gap:8px;} .dpalette .bpanel-title{flex-basis:100%;margin:0;} .dpal-item{flex:1 1 120px;margin-bottom:0 !important;}}
  .dpalette{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;}
  .dpal-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;margin-bottom:8px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;}
  .dpal-item:hover{border-color:#1A73E8;box-shadow:0 0 0 2px rgba(26,115,232,0.12);}
  .dpal-item svg{width:100px;height:42px;}
  .dpal-name{font-size:0.8rem;font-weight:700;color:var(--text);text-align:center;line-height:1.25;}
  .dpal-name small{display:block;font-weight:600;color:var(--muted);font-size:0.78rem;}
  .dtoolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:8px;min-height:50px;font-size:0.88rem;}
  .dtoolbar select{width:auto;flex:1 1 220px;padding:6px 8px;font-size:0.88rem;}
  .dt-info{color:var(--muted);font-weight:600;}
  .dt-info.warn{color:var(--spray-dim);}
  .dt-sep{flex:1;}
  .dlabelbtn{padding:5px 12px;font-size:0.84rem;background:var(--surface2);border:1px solid var(--line);color:var(--text);}
  .dlabelbtn.sel{background:#1A73E8;border-color:#1A73E8;color:#fff;}
  .dcanvas-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;max-height:660px;}
  .dcanvas{position:relative;background-color:#fff;background-image:radial-gradient(#D3DAE2 1px, transparent 1px);background-size:20px 20px;}
  .dsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible;}
  .dedge-hit{pointer-events:stroke;cursor:pointer;}
  .dedge-lbl{pointer-events:all;cursor:pointer;}
  .dnode{position:absolute;z-index:2;cursor:move;user-select:none;-webkit-user-select:none;touch-action:none;}
  .dnode svg.dshape{position:absolute;left:0;top:0;overflow:visible;}
  .dnode.target svg.dshape *{stroke:#1A73E8;stroke-width:2.8;}
  .dtext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:0.8rem;font-weight:700;color:#1F2A1A;line-height:1.3;padding:4px 14px;pointer-events:none;}
  .dnode.decision .dtext{padding:4px 42px;}
  .dnode.io .dtext{padding:4px 26px;}
  .dtext.empty{color:#98A2AC;font-style:italic;font-weight:600;}
  .dhandle{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#1A73E8;border:2px solid #fff;box-shadow:0 0 0 1px #1A73E8;opacity:0;cursor:crosshair;z-index:3;transition:opacity .1s;touch-action:none;}
  .dnode:hover .dhandle,.dnode.sel .dhandle{opacity:0.92;}
  @media(hover:none){.dhandle{opacity:0.75;}}
  .dempty{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:0.94rem;color:#A3ADB6;pointer-events:none;}
  .dcheck{font-size:0.88rem;margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--leaf-soft);border:1px solid var(--leaf);}
  .dcheck.warn{background:var(--amber-soft);border-color:#F3D3A0;}
  .dcheck ul{margin:6px 0 0 18px;padding:0;}

  /* ---------- number line chart (Task 4) ---------- */
  .numberline{position:relative;height:80px;margin:20px 0 6px;}
  .nl-axis{position:absolute;top:44px;left:10px;right:10px;height:2px;background:var(--line);}
  .nl-band{position:absolute;top:34px;height:20px;background:rgba(63,163,77,0.16);border-left:2px solid var(--leaf);border-right:2px solid var(--leaf);border-radius:6px;}
  .nl-point{position:absolute;top:34px;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid;display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:700;z-index:2;background:var(--surface);}
  .nl-point.correct{border-color:var(--green);color:var(--green);}
  .nl-point.wrong{border-color:var(--red);color:var(--red);}
  .nl-scale{position:absolute;top:52px;font-size:0.78rem;color:var(--muted-dim);transform:translateX(-50%);}
  .chartlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:0.88rem;color:var(--muted);margin-bottom:14px;}
  .chartlegend span{display:inline-flex;align-items:center;gap:6px;}
  .chartlegend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

  /* ---------- bar chart (Task 5) ---------- */
  .envtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .envtab{padding:6px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:0.88rem;cursor:pointer;color:var(--text);}
  .envtab.active{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:700;}
  .bargroup-chart{display:flex;gap:20px;align-items:flex-end;height:150px;margin:6px 0 18px;padding:14px 14px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-sm);}
  .bargroup{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end;}
  .bargroup .bars{display:flex;gap:5px;align-items:flex-end;height:100px;}

<body>
<div id="app"></div>

<script>
/* ============================================================
   หน่วยข้อสอบ: "Smart Spray Warning System"
   แบบฝึกเทียบเคียงลักษณะข้อสอบ PISA 2025: Learning in the Digital World
   โครงสร้าง: Show (5 ข้อ) -> Learn (5 ภาระงาน: เรียงลำดับอัลกอริทึม / เขียนโปรแกรมแบบบล็อก /
              วาดผังงาน / เงื่อนไขช่วงค่า / วิเคราะห์ข้อมูล) -> Apply -> Reflect
   สัดส่วนคะแนน: Show 15% · Learn 50% (ภาระงานละ 10%) · Apply 25% · Reflect 10%
   ============================================================ */

const TOTAL_SECONDS = 30 * 60;
const STORAGE_PREFIX = "smartspray_record:";
const CONFIG_KEY = "smartspray_config:webhook_url";
const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycby-EQrWXlKE8-zo7JK1DAwytJ5F5Jb8NtbHfo1OmoNwnzVnsWYiFOhtNKM0x_xGEmCg/exec";

/* แบบฝึกนี้เป็น "อัลกอริทึมเรียงลำดับ" (sequence) ไม่ใช่ผังงานแบบมีทางแยกเงื่อนไข (decision branch)
   จึงใช้สัญลักษณ์เพียง 2 แบบ: กรอบมนหัวท้าย (Terminal) สำหรับจุดเริ่มต้น/สิ้นสุดเท่านั้น
   ส่วนขั้นตอนอื่นทุกขั้นตอนใช้กรอบสี่เหลี่ยมผืนผ้า (Process) เหมือนกันหมด แสดงลำดับการทำงานทีละขั้น */
const FLOW_STEPS = [
  {id:"start", type:"start-end", text:"เริ่มต้น (Start)", correctOrder:1},
  {id:"input", type:"process", text:"รับค่านำเข้า: วันที่ปัจจุบัน, วันที่พ่นล่าสุด, ค่าความเข้มข้นที่เลือก, กลุ่ม MoA ที่ใช้", correctOrder:2},
  {id:"dec1", type:"process", text:"ตรวจสอบว่าถึงกำหนดเวลาที่อนุญาตให้พ่นครั้งถัดไปหรือยัง", correctOrder:3},
  {id:"dec2", type:"process", text:"ตรวจสอบว่าค่าความเข้มข้นอยู่ในช่วงที่กำหนดหรือไม่", correctOrder:4},
  {id:"dec3", type:"process", text:"ตรวจสอบว่าใช้กลุ่ม MoA เดิมซ้ำเกินจำนวนครั้งที่กำหนดหรือไม่", correctOrder:5},
  {id:"end", type:"start-end", text:"แสดงผลลัพธ์การประเมิน (แจ้งเตือน หรือ อนุญาตพิจารณาพ่น) แล้วจบการทำงาน (End)", correctOrder:6},
];

const state = {
  screen: "login",
  user: "",
  grade: "",
  showSettings: false,
  config: { webhookUrl: "", draft: "", status: "" },
  timerId: null,
  remaining: TOTAL_SECONDS,
  finished: false,
  show: { a1:null, a2:[], a3:null, a4:null, a5:null },
  learn: {
    t1: { order:{dec2:1,start:2,dec3:3,input:4,end:5,dec1:6}, explain:"" },
    t2: { script:[], runs:{}, stageScenario:"s1", confirmClear:false },                      // บล็อกคำสั่ง
    t3: { nodes:[], edges:[], selected:null, seq:1, showCheck:false, confirmClear:false },    // ผังงานแบบลากวาง
    t4: { min:15, max:45, explain:"" },
    t5: { fn:"", fp:"", acc:"", worst:null, selectedGroup:null }
  },
  apply: { minInterval:3, concTolerance:10, maxConsecutive:4, ran:false, results:null, tradeoff:"" },
  reflect: { understand:null, confidence:null, difficulty:null, strategy:"", more:"" },
  scores: { show:0, learn:0, learn1:0, learn2:0, learn3:0, learn4:0, learn5:0, apply:0, reflect:0, overall:0, level:1 }
};

/* ---------------- utility ---------------- */
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); }
function initials(name){ return (name||"?").trim().slice(0,1).toUpperCase(); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }

function startTimer(){
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    if(state.finished){ clearInterval(state.timerId); return; }
    state.remaining--;
    if(state.remaining<=0){
      state.remaining=0;
      clearInterval(state.timerId);
      finishTest(true);
      return;
    }
    const t = document.getElementById("timerText");
    const box = document.getElementById("timerBox");
    if(t) t.textContent = fmtTime(state.remaining);
    if(box) box.classList.toggle("warn", state.remaining<300);
  },1000);
}

/* ---------------- navigation ---------------- */
function goto(screen){ state.screen = screen; render(); window.scrollTo({top:0,behavior:"smooth"}); }

const PHASES = [
  {key:"show", label:"SHOW"},
  {key:"learn", label:"LEARN"},
  {key:"apply", label:"APPLY"},
  {key:"reflect", label:"REFLECT"},
];
function phaseIndexFor(screen){
  if(screen==="show") return 0;
  if(screen.startsWith("learn")) return 1;
  if(screen==="apply") return 2;
  if(screen==="reflect") return 3;
  return -1;
}

/* ---------------- SHOW scoring ---------------- */
function scoreShow(){
  let s=0;                                   // 5 ข้อ ข้อละ 20 คะแนน
  if(state.show.a1==="b") s+=20;
  const a2ok = state.show.a2.includes("moa_repeat") && state.show.a2.includes("short_interval") && !state.show.a2.includes("packaging");
  if(a2ok) s+=20;
  if(state.show.a3==="decision") s+=20;
  if(state.show.a4==="a") s+=20;
  if(state.show.a5==="if") s+=20;
  state.scores.show = s;
  return s;
}

/* ---------------- LEARN Task 1: flowchart ordering ---------------- */
function scoreLearn1(){
  const order = state.learn.t1.order;
  let matches = 0;
  FLOW_STEPS.forEach(step=>{ if(parseInt(order[step.id])===step.correctOrder) matches++; });
  const explainOk = state.learn.t1.explain.trim().length>=15;
  const s = Math.round((matches/FLOW_STEPS.length)*70) + (explainOk?30:0);
  state.scores.learn1 = s;
  return s;
}

/* ---------------- LEARN Task 2: block coding (Scratch-like) ---------------- */
/* ค่าที่ระบบกำหนดสำหรับภาระงานนี้ */
const BLOCK_RULES = { minInterval:7, concMin:20, concMax:40, maxRepeat:2 };
const BLOCK_CATS = {
  event:  {name:"เหตุการณ์",     color:"#FFBF00"},
  sensing:{name:"การรับรู้",      color:"#5CB1D6"},
  control:{name:"ควบคุม",         color:"#FFAB19"},
  looks:  {name:"รูปร่างหน้าตา",  color:"#9966FF"},
  motion: {name:"การเคลื่อนไหว",  color:"#4C97FF"},
};
/* hat = บล็อกเริ่มสคริปต์, c = บล็อกรูปตัว C ที่ซ้อนบล็อกอื่นไว้ด้านในได้, distractor = บล็อกลวง */
const BLOCK_DEFS = {
  whenflag: {cat:"event",   hat:true, html:'เมื่อคลิก <span class="sb-flag">⚑</span> เริ่ม'},
  getinput: {cat:"sensing", html:'รับค่า <span class="sb-str">วันที่พ่นล่าสุด</span> <span class="sb-str">ความเข้มข้น</span> <span class="sb-str">กลุ่ม MoA</span>'},
  if_time:  {cat:"control", c:true, html:'ถ้า <span class="sb-cond">จำนวนวันนับจากพ่นล่าสุด &lt; 7</span> แล้ว'},
  if_conc:  {cat:"control", c:true, html:'ถ้า <span class="sb-cond">ความเข้มข้น &lt; 20 หรือ &gt; 40</span> แล้ว'},
  if_moa:   {cat:"control", c:true, html:'ถ้า <span class="sb-cond">ใช้ MoA เดิมติดกัน &gt; 2 ครั้ง</span> แล้ว'},
  repeat:   {cat:"control", c:true, distractor:true, html:'ทำซ้ำ <span class="sb-str">10</span> ครั้ง'},
  stop:     {cat:"control", html:'หยุด <span class="sb-str">ทั้งหมด</span>'},
  say_ok:   {cat:"looks",   say:"อนุญาตให้พิจารณาพ่นได้"},
  say_moa:  {cat:"looks",   say:"เสี่ยงดื้อยา ให้สลับกลุ่ม MoA"},
  say_spray:{cat:"looks",   say:"สั่งพ่นสารทันที", distractor:true},
  say_time: {cat:"looks",   say:"ยังไม่ถึงกำหนดพ่น"},
  say_conc: {cat:"looks",   say:"ปรับค่าความเข้มข้นให้อยู่ในช่วง"},
  move:     {cat:"motion",  distractor:true, html:'เคลื่อนที่ <span class="sb-str">10</span> ก้าว'},
};
Object.keys(BLOCK_DEFS).forEach(k=>{ const d = BLOCK_DEFS[k]; if(d.say && !d.html) d.html = 'พูด <span class="sb-str">'+d.say+'</span>'; });
/* ลำดับบล็อกในชุดคำสั่ง (สลับไว้ ไม่เรียงตามคำตอบ) */
const BLOCK_PALETTE = ["whenflag","getinput","if_conc","if_moa","if_time","repeat","stop","say_ok","say_moa","say_spray","say_time","say_conc","move"];
/* ข้อมูลแปลงจำลองสำหรับทดสอบโปรแกรม (แปลง 1-2 ไม่ผ่านหลายเงื่อนไขพร้อมกัน เพื่อทดสอบลำดับและการหยุดทำงาน) */
const BLOCK_TESTS = [
  {id:"s1", name:"แปลง 1", days:2,  conc:50, repeat:3, expect:"ยังไม่ถึงกำหนดพ่น"},
  {id:"s2", name:"แปลง 2", days:9,  conc:55, repeat:3, expect:"ปรับค่าความเข้มข้นให้อยู่ในช่วง"},
  {id:"s3", name:"แปลง 3", days:10, conc:30, repeat:4, expect:"เสี่ยงดื้อยา ให้สลับกลุ่ม MoA"},
  {id:"s4", name:"แปลง 4", days:12, conc:28, repeat:1, expect:"อนุญาตให้พิจารณาพ่นได้"},
];
let blockUidSeq = 1;
function newBlock(type){ const b = {uid:"b"+(blockUidSeq++), type}; if(BLOCK_DEFS[type].c) b.children = []; return b; }
function blockFind(list, pred, out){ out = out || []; list.forEach(b=>{ if(pred(b)) out.push(b); if(b.children) blockFind(b.children, pred, out); }); return out; }
function blockLoc(list, uid){
  for(let i=0;i<list.length;i++){
    if(list[i].uid===uid) return {list, index:i};
    if(list[i].children){ const r = blockLoc(list[i].children, uid); if(r) return r; }
  }
  return null;
}
function blockList(listId){
  if(listId==="root") return state.learn.t2.script;
  const b = blockFind(state.learn.t2.script, x=>x.uid===listId)[0];
  return b ? b.children : null;
}
/* บล็อกหมวกวางได้เฉพาะบนสุดของสคริปต์ และห้ามวางบล็อกอื่นไว้เหนือบล็อกหมวก */
function canDropBlock(btype, listId, idx, dragUid){
  const root = state.learn.t2.script;
  const hatAt0 = !!(root[0] && BLOCK_DEFS[root[0].type].hat && root[0].uid!==dragUid);
  if(BLOCK_DEFS[btype].hat) return listId==="root" && idx===0 && !hatAt0;
  if(listId==="root" && idx===0 && hatAt0) return false;
  return true;
}
function blockCond(type, sc){
  if(type==="if_time") return sc.days < BLOCK_RULES.minInterval;
  if(type==="if_conc") return sc.conc < BLOCK_RULES.concMin || sc.conc > BLOCK_RULES.concMax;
  if(type==="if_moa")  return sc.repeat > BLOCK_RULES.maxRepeat;
  return false;
}
/* ตัวแปลคำสั่ง: รันสคริปต์กับข้อมูลแปลงจำลอง 1 แปลง */
function runBlockProgram(script, sc){
  const out = {says:[], moved:0, error:"", warn:"", pass:false};
  if(!script.length || script[0].type!=="whenflag"){
    out.error = "โปรแกรมไม่เริ่มทำงาน: ต้องมีบล็อก “เมื่อคลิก ⚑ เริ่ม” อยู่บนสุดของสคริปต์";
    return out;
  }
  let hasInput = false, stopped = false, steps = 0;
  const exec = (list)=>{
    for(const b of list){
      if(stopped || ++steps > 500){ stopped = true; return; }
      const d = BLOCK_DEFS[b.type];
      if(b.type==="getinput") hasInput = true;
      else if(b.type==="stop"){ stopped = true; return; }
      else if(b.type==="move") out.moved += 10;
      else if(b.type==="repeat"){ for(let i=0;i<10 && !stopped;i++) exec(b.children||[]); }
      else if(b.type.indexOf("if_")===0){
        if(!hasInput){ out.warn = "บล็อก “ถ้า” ทำงานก่อนบล็อก “รับค่า” จึงยังไม่มีข้อมูลให้ตรวจสอบเงื่อนไข"; continue; }
        if(blockCond(b.type, sc)) exec(b.children||[]);
      }
      else if(d.say) out.says.push(d.say);
    }
  };
  exec(script.slice(1));
  out.pass = !out.error && out.says.length===1 && out.says[0]===sc.expect;
  return out;
}
/* เกณฑ์ให้คะแนน (100): เริ่มด้วยบล็อกหมวก 10 · รับค่าก่อนตรวจเงื่อนไข 15 · มีบล็อก "ถ้า" ครบ 9 + ลำดับถูก 6
   · ด้านในบล็อก "ถ้า" แต่ละบล็อกมี [พูดข้อความที่ตรงกัน, หยุดทั้งหมด] 3×10 · จบด้วย "อนุญาต" 10
   · ผ่านการทดสอบแปลงจำลอง 15 · ไม่มีบล็อกลวง 5 */
function scoreLearn2(){
  const sc = state.learn.t2.script;
  const top = sc.map(b=>b.type);
  let s = 0;
  if(top[0]==="whenflag") s += 10;
  const IFS = ["if_time","if_conc","if_moa"];
  const ifPos = IFS.map(ty=>top.indexOf(ty));
  const present = ifPos.filter(i=>i>=0);
  const firstIf = present.length ? Math.min(...present) : Infinity;
  const iIn = top.indexOf("getinput");
  if(iIn>0 && iIn<firstIf) s += 15;
  s += present.length*3;
  if(present.length===3 && ifPos[0]<ifPos[1] && ifPos[1]<ifPos[2]) s += 6;
  const SAY = {if_time:"say_time", if_conc:"say_conc", if_moa:"say_moa"};
  IFS.forEach(ty=>{
    const blk = blockFind(sc, b=>b.type===ty)[0];
    if(!blk) return;
    const ch = (blk.children||[]).map(b=>b.type);
    if(ch.length===2 && ch[0]===SAY[ty] && ch[1]==="stop") s += 10;
    else if(ch.indexOf(SAY[ty])>=0) s += 5;
  });
  const last = top.length-1;
  if(top[last]==="say_ok" && present.length===3 && ifPos.every(i=>i<last)) s += 10;
  const passed = BLOCK_TESTS.filter(t=>runBlockProgram(sc, t).pass).length;
  s += Math.round(passed/BLOCK_TESTS.length*15);
  if(sc.length>0 && !blockFind(sc, b=>BLOCK_DEFS[b.type].distractor).length) s += 5;
  s = Math.min(100, s);
  state.scores.learn2 = s;
  return s;
}

/* ---------------- LEARN Task 3: flowchart editor (draw.io-like) ---------------- */
const DRAW_W = 680, DRAW_H = 620, DRAW_GRID = 10;
const DRAW_SHAPES = {
  terminal:{label:"Terminal",       th:"เริ่มต้น / สิ้นสุด",   w:140, h:50},
  process: {label:"Process",        th:"การประมวลผล",        w:190, h:60},
  io:      {label:"Input / Output", th:"รับข้อมูล / แสดงผล",  w:200, h:60},
  decision:{label:"Decision",       th:"การตัดสินใจ",         w:200, h:100},
};
const DRAW_COLORS = {
  terminal:{fill:"#EEF3E2", stroke:"#6B7B60"},
  process: {fill:"#E4F3E2", stroke:"#3FA34D"},
  io:      {fill:"#E3EEF8", stroke:"#5C8FC2"},
  decision:{fill:"#FFEFE2", stroke:"#E8732C"},
};
/* ข้อความที่เลือกใส่ในสัญลักษณ์ได้ (shape = สัญลักษณ์ที่ถูกต้องตามหลักการเขียนผังงาน) */
const DRAW_TEXTS = [
  {id:"start", shape:"terminal", text:"เริ่มต้น"},
  {id:"input", shape:"io",       text:"รับค่า วันที่พ่นล่าสุด และวันที่ปัจจุบัน"},
  {id:"calc",  shape:"process",  text:"จำนวนวัน = วันที่ปัจจุบัน − วันที่พ่นล่าสุด"},
  {id:"check", shape:"decision", text:"จำนวนวัน ≥ 7 วัน ?"},
  {id:"allow", shape:"io",       text:"แสดงผล “อนุญาตให้พิจารณาพ่นได้”"},
  {id:"wait",  shape:"io",       text:"แสดงผล “ยังไม่ถึงกำหนดพ่น”"},
  {id:"end",   shape:"terminal", text:"สิ้นสุด"},
  {id:"x_spray",  distractor:true, text:"สั่งพ่นสารทันทีโดยอัตโนมัติ"},
  {id:"x_choose", distractor:true, text:"เลือกสารเคมีกำจัดแมลงแทนเกษตรกร"},
];
const DRAW_TEXT_ORDER = ["wait","calc","x_spray","end","input","allow","check","x_choose","start"];
const DRAW_REQ_EDGES = [
  {from:"start", to:"input"}, {from:"input", to:"calc"}, {from:"calc", to:"check"},
  {from:"check", to:"allow", label:"ใช่"}, {from:"check", to:"wait", label:"ไม่ใช่"},
  {from:"allow", to:"end"}, {from:"wait", to:"end"},
];
function drawText(id){ return DRAW_TEXTS.find(x=>x.id===id); }
function drawNode(id){ return state.learn.t3.nodes.find(n=>n.id===id); }
function drawSnap(v){ return Math.round(v/DRAW_GRID)*DRAW_GRID; }
function drawCenter(n){ const S = DRAW_SHAPES[n.shape]; return {x:n.x+S.w/2, y:n.y+S.h/2}; }
/* จุดบนขอบสัญลักษณ์ในทิศทางไปยัง (tx,ty) — ใช้วางหัว/ท้ายลูกศรให้ชิดขอบ */
function drawBoundary(n, tx, ty){
  const S = DRAW_SHAPES[n.shape], c = drawCenter(n);
  const dx = tx-c.x, dy = ty-c.y;
  if(!dx && !dy) return c;
  let k;
  if(n.shape==="decision") k = 1/(Math.abs(dx)/(S.w/2) + Math.abs(dy)/(S.h/2));
  else k = Math.min(dx ? (S.w/2)/Math.abs(dx) : Infinity, dy ? (S.h/2)/Math.abs(dy) : Infinity);
  return {x:c.x+dx*k, y:c.y+dy*k};
}
function drawDeleteSelected(){
  const t = state.learn.t3, s = t.selected;
  if(!s) return;
  if(s.kind==="node"){ t.nodes = t.nodes.filter(n=>n.id!==s.id); t.edges = t.edges.filter(e=>e.from!==s.id && e.to!==s.id); }
  else t.edges = t.edges.filter(e=>e.id!==s.id);
  t.selected = null;
}
function drawAnalyze(){
  const {nodes, edges} = state.learn.t3;
  const req = DRAW_TEXTS.filter(x=>!x.distractor);
  let shapeOk = 0;
  req.forEach(x=>{ if(nodes.some(n=>n.textId===x.id && n.shape===x.shape)) shapeOk++; });
  let edgeOk = 0;
  DRAW_REQ_EDGES.forEach(r=>{
    if(edges.some(e=>{ const a = drawNode(e.from), b = drawNode(e.to);
      return a && b && a.textId===r.from && b.textId===r.to && (!r.label || e.label===r.label); })) edgeOk++;
  });
  const noJunk = nodes.length>0 && nodes.every(n=>n.textId && !drawText(n.textId).distractor);
  const decisions = nodes.filter(n=>n.shape==="decision");
  const decOk = decisions.length>0 && decisions.every(dn=>{
    const outs = edges.filter(e=>e.from===dn.id);
    return outs.length===2 && outs.some(e=>e.label==="ใช่") && outs.some(e=>e.label==="ไม่ใช่");
  });
  const flowOk = nodes.length>0 && nodes.every(n=>{
    const outs = edges.filter(e=>e.from===n.id).length, ins = edges.filter(e=>e.to===n.id).length;
    if(n.textId==="start") return ins===0 && outs===1;
    if(n.textId==="end") return outs===0 && ins>=1;
    if(n.shape==="decision") return ins>=1;
    return ins>=1 && outs===1;
  });
  return {shapeOk, shapeTotal:req.length, edgeOk, edgeTotal:DRAW_REQ_EDGES.length, noJunk, decOk, flowOk};
}
/* เกณฑ์ให้คะแนน (100): สัญลักษณ์+ข้อความถูกต้อง 35 · ลูกศรเชื่อมต่อถูกต้อง (รวมป้าย ใช่/ไม่ใช่) 50
   · ความเรียบร้อยของผังงาน 15 (นับเมื่อวางสัญลักษณ์ถูกอย่างน้อย 4 จาก 7) */
function scoreLearn3(){
  const a = drawAnalyze();
  let s = Math.round(a.shapeOk/a.shapeTotal*35) + Math.round(a.edgeOk/a.edgeTotal*50);
  if(a.shapeOk>=4){ if(a.noJunk) s += 5; if(a.decOk) s += 5; if(a.flowOk) s += 5; }
  s = Math.min(100, s);
  state.scores.learn3 = s;
  return s;
}
function escapeHtml(v){ return String(v).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- LEARN Task 4: concentration range rule ---------------- */
const T4_CASES = [
  {val:15, expected:false},
  {val:25, expected:true},
  {val:38, expected:true},
  {val:45, expected:false},
  {val:20, expected:true},
  {val:41, expected:false},
];
function t4Predict(v){
  const {min,max} = state.learn.t4;
  return v>=min && v<=max;
}
function t4Accuracy(){
  let correct=0;
  T4_CASES.forEach(c=>{ if(t4Predict(c.val)===c.expected) correct++; });
  return correct;
}
function scoreLearn4(){
  const correct = t4Accuracy();
  const s = Math.round((correct/T4_CASES.length)*100);
  state.scores.learn4 = s;
  return s;
}

/* สัดส่วนคะแนนรวม: Show 15% · Learn 50% (5 ภาระงาน ภาระงานละ 10%) · Apply 25% · Reflect 10% */
const SCORE_WEIGHTS = { show:0.15, learn:0.50, apply:0.25, reflect:0.10 };

function scoreLearnOverall(){
  const parts = [scoreLearn1(), scoreLearn2(), scoreLearn3(), scoreLearn4(), scoreLearn5()];
  const s = Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);

}

/* ---------------- APPLY ---------------- */
const APPLY_SCENARIOS = [
  {name:"แปลงเสี่ยงต่ำ ประชากรแมลงน้อย",         reqMinInterval:3, reqConcTolerance:8, reqMaxConsecutive:4},
  {name:"แปลงเสี่ยงปานกลาง",                    reqMinInterval:5, reqConcTolerance:6, reqMaxConsecutive:3},
  {name:"แปลงเสี่ยงสูง ประชากรระบาด",           reqMinInterval:7, reqConcTolerance:4, reqMaxConsecutive:2},
  {name:"ใช้สารกลุ่ม MoA เดิมติดต่อกันหลายรอบ", reqMinInterval:6, reqConcTolerance:5, reqMaxConsecutive:1},
  {name:"ฤดูฝน ประสิทธิภาพสารลดลง",             reqMinInterval:4, reqConcTolerance:5, reqMaxConsecutive:3},
  {name:"ใกล้ช่วงเก็บเกี่ยว (pre-harvest)",     reqMinInterval:8, reqConcTolerance:6, reqMaxConsecutive:2},
  {name:"แปลงเกษตรผสมผสาน",                     reqMinInterval:5, reqConcTolerance:7, reqMaxConsecutive:3},
  {name:"แปลงระบาดรุนแรง หลายชนิดแมลง",         reqMinInterval:7, reqConcTolerance:3, reqMaxConsecutive:1},
];
function runApply(){
  const {minInterval, concTolerance, maxConsecutive} = state.apply;
  const rows = APPLY_SCENARIOS.map(sc=>{
    const pass = minInterval>=sc.reqMinInterval && concTolerance<=sc.reqConcTolerance && maxConsecutive<=sc.reqMaxConsecutive;
    return {...sc, pass};
  });
  const passCount = rows.filter(r=>r.pass).length;
  const accuracy = Math.round((passCount/rows.length)*100);
  const nuisance = Math.max(0, Math.round((minInterval-10)*0.6 + (3-concTolerance>0?(3-concTolerance)*3:0)));
  state.apply.results = {rows, accuracy, nuisance};
  state.apply.ran = true;
  render();
}
function scoreApply(){
  if(!state.apply.results){ state.scores.apply=0; return 0; }
  const accPart = Math.round(state.apply.results.accuracy*0.7);
  const explainOk = state.apply.tradeoff.trim().length>=20;
  const s = accPart + (explainOk?30:0);
  state.scores.apply = Math.min(100,s);
  return state.scores.apply;
}

/* ---------------- REFLECT ---------------- */
function scoreReflect(){
  let filled=0, total=4;
  if(state.reflect.understand) filled++;
  if(state.reflect.confidence) filled++;
  if(state.reflect.difficulty) filled++;
  if(state.reflect.strategy.trim().length>=5) filled++;
  state.scores.reflect = Math.round((filled/total)*100);
  return state.scores.reflect;
}

/* ---------------- overall ---------------- */
function computeLevel(overall){
  if(overall>=85) return {n:4, name:"ผู้เรียนรู้ขั้นสูงในโลกดิจิทัล", en:"Advanced Digital Learner"};
  if(overall>=70) return {n:3, name:"ผู้เรียนรู้ที่ชำนาญ", en:"Proficient Digital Learner"};
  if(overall>=50) return {n:2, name:"ผู้เรียนรู้ที่กำลังพัฒนา", en:"Developing Digital Learner"};
  return {n:1, name:"ผู้เรียนรู้เริ่มต้น", en:"Emerging Digital Learner"};
}

async function finishTest(timedOut){
  state.finished = true;
  if(state.timerId) clearInterval(state.timerId);
  scoreShow();
  scoreLearnOverall();
  scoreApply();
  scoreReflect();
  const overall = Math.round(
    state.scores.show*SCORE_WEIGHTS.show + state.scores.learn*SCORE_WEIGHTS.learn +
    state.scores.apply*SCORE_WEIGHTS.apply + state.scores.reflect*SCORE_WEIGHTS.reflect
  );
  state.scores.overall = overall;
  const lvl = computeLevel(overall);
  state.scores.level = lvl.n;
  state.scores.levelName = lvl.name;
  state.scores.levelEn = lvl.en;

  const record = {
    sheet: "Sheet2",
    timestamp: new Date().toISOString(),
    scenario: "Smart Spray Warning System",
    user: state.user,
    grade: state.grade,
    show: state.scores.show,
    learn: state.scores.learn,
    learn_detail: {task1:state.scores.learn1, task2:state.scores.learn2, task3:state.scores.learn3, task4:state.scores.learn4, task5:state.scores.learn5},
    apply: state.scores.apply,
    reflect: state.scores.reflect,
    overall: state.scores.overall,
    level: state.scores.level,
    levelName: state.scores.levelName,
    timedOut: !!timedOut
  };
  try{
    const key = STORAGE_PREFIX + Date.now() + "_" + (state.user||"user").replace(/\s+/g,"_");
    await window.storage.set(key, JSON.stringify(record), true);
  }catch(e){ console.error("บันทึกข้อมูลไม่สำเร็จ", e); }

  await sendToSheet(record);

  goto("report");
}

    case "learn1": html += renderLearn1(); break;
    case "learn2": html += renderLearn2(); break;
    case "learn3": html += renderLearn3(); break;
    case "learn4": html += renderLearn4(); break;
    case "learn5": html += renderLearn5(); break;
    case "apply": html += renderApply(); break;
    case "reflect": html += renderReflect(); break;
    case "report": html += renderReport(); break;
    case "history": html += renderHistory(); break;
  }
  app.innerHTML = html;
  Object.keys(keepScroll).forEach(id=>{ const el = document.getElementById(id); if(el){ el.scrollLeft = keepScroll[id][0]; el.scrollTop = keepScroll[id][1]; } });

}

function choiceGroup(name, type, options, current){
  return `<div class="choicegroup" data-name="${name}" data-type="${type}">
    ${options.map(([val,label])=>{
      const checked = type==="checkbox" ? (current||[]).includes(val) : current===val;
      return `<label class="choice ${checked?"selected":""}">
        <input type="${type}" name="${name}" value="${val}" ${checked?"checked":""}>
        <span>${label}</span>
      </label>`;
    }).join("")}
  </div>`;
}

function blockHtml(b, src){
  const d = BLOCK_DEFS[b.type];
  const cls = "sblock sb-"+d.cat+(d.hat?" sb-hat":"")+(d.c?" sb-cblock":"");
  const attr = src==="palette" ? `data-src="palette" data-btype="${b.type}"` : `data-src="script" data-btype="${b.type}" data-uid="${b.uid}"`;
  const del = src==="script" ? `<button type="button" class="sb-del" data-del="${b.uid}" title="ลบบล็อก">×</button>` : "";
  if(d.c){
    const inner = src==="script" ? blockListHtml(b.children||[], b.uid) : "";
    return `<div class="${cls}" ${attr}><div class="sb-head">${d.html}</div>${del}<div class="sb-mouth">${inner}</div><div class="sb-foot"></div></div>`;
  }
  return `<div class="${cls}" ${attr}>${d.html}${del}</div>`;
}
function blockListHtml(list, listId){
  let h = "";
  list.forEach((b,i)=>{ h += `<div class="bslot" data-list="${listId}" data-index="${i}"></div>` + blockHtml(b, "script"); });
  return h + `<div class="bslot" data-list="${listId}" data-index="${list.length}"></div>`;
}

function drawShapeSvg(shape, w, h, fill, stroke, sw){
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  const p = sw/2 + 0.5;
  if(shape==="terminal") return `<rect x="${p}" y="${p}" width="${w-2*p}" height="${h-2*p}" rx="${(h-2*p)/2}" ${a}/>`;
  if(shape==="process")  return `<rect x="${p}" y="${p}" width="${w-2*p}" height="${h-2*p}" rx="3" ${a}/>`;
  if(shape==="io"){ const k = 20; return `<polygon points="${k+p},${p} ${w-p},${p} ${w-k-p},${h-p} ${p},${h-p}" ${a}/>`; }
  return `<polygon points="${w/2},${p} ${w-p},${h/2} ${w/2},${h-p} ${p},${h/2}" ${a}/>`;
}
function drawEdgesInner(){
  const t = state.learn.t3;
  return t.edges.map(e=>{
    const a = drawNode(e.from), b = drawNode(e.to);
    if(!a || !b) return "";
    const ac = drawCenter(a), bc = drawCenter(b);
    const p1 = drawBoundary(a, bc.x, bc.y), p2 = drawBoundary(b, ac.x, ac.y);
    const sel = t.selected && t.selected.kind==="edge" && t.selected.id===e.id;
    const col = sel ? "#1A73E8" : "#4A5A4A";
    let lbl = "";
    if(e.label){
      const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2, lw = e.label.length*8 + 20;
      lbl = `<g class="dedge-lbl" data-edge="${e.id}"><rect x="${mx-lw/2}" y="${my-11}" width="${lw}" height="22" rx="5" fill="#fff" stroke="${col}"/>`
          + `<text x="${mx}" y="${my+5}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">${e.label}</text></g>`;
    }
    return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${col}" stroke-width="${sel?2.6:1.8}" marker-end="url(#${sel?"dArrowSel":"dArrow"})"/>`
         + `<line class="dedge-hit" data-edge="${e.id}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="transparent" stroke-width="14"/>` + lbl;
  }).join("");
}
function drawNodeHtml(n){
  const t = state.learn.t3, S = DRAW_SHAPES[n.shape], C = DRAW_COLORS[n.shape];
  const sel = t.selected && t.selected.kind==="node" && t.selected.id===n.id;
  const tx = n.textId ? drawText(n.textId).text : "คลิกเพื่อเลือกข้อความ";
  const handles = [["50%","0"],["100%","50%"],["50%","100%"],["0","50%"]]
    .map(([l,tp])=>`<span class="dhandle" data-handle="${n.id}" style="left:${l};top:${tp};" title="ลากไปยังสัญลักษณ์อื่นเพื่อสร้างลูกศร"></span>`).join("");
  return `<div class="dnode ${n.shape}${sel?" sel":""}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${S.w}px;height:${S.h}px;">`
    + `<svg class="dshape" width="${S.w}" height="${S.h}">${drawShapeSvg(n.shape, S.w, S.h, C.fill, sel?"#1A73E8":C.stroke, sel?2.4:1.6)}</svg>`
    + `<div class="dtext${n.textId?"":" empty"}">${escapeHtml(tx)}</div>${handles}</div>`;
}
function renderLearn3(){
  const t = state.learn.t3;
  const sel = t.selected;
  const selNode = sel && sel.kind==="node" ? drawNode(sel.id) : null;
  const selEdge = sel && sel.kind==="edge" ? t.edges.find(e=>e.id===sel.id) : null;
  let tool;
  if(selNode){
    tool = `<span class="dt-info">${DRAW_SHAPES[selNode.shape].label} · ข้อความ:</span>
      <select id="drawTextSel"><option value="">-- เลือกข้อความในสัญลักษณ์ --</option>
        ${DRAW_TEXT_ORDER.map(id=>`<option value="${id}" ${selNode.textId===id?"selected":""}>${escapeHtml(drawText(id).text)}</option>`).join("")}
      </select>
      <button type="button" class="btn-ghost btn-sm" id="drawDelete">ลบสัญลักษณ์</button>`;
  } else if(selEdge){
    const src = drawNode(selEdge.from);
    const need = src && src.shape==="decision" && !selEdge.label;
    tool = `<span class="dt-info${need?" warn":""}">${need?"ลูกศรออกจากจุดตัดสินใจ — กำหนดป้าย:":"ป้ายลูกศร:"}</span>
      ${["","ใช่","ไม่ใช่"].map(l=>`<button type="button" class="dlabelbtn ${selEdge.label===l?"sel":""}" data-elabel="${l}">${l||"ไม่มีป้าย"}</button>`).join("")}
      <button type="button" class="btn-ghost btn-sm" id="drawReverse">⇅ กลับทิศทาง</button>
      <button type="button" class="btn-ghost btn-sm" id="drawDelete">ลบลูกศร</button>`;
  } else {
    tool = `<span class="dt-info">คลิกสัญลักษณ์หรือลูกศรเพื่อแก้ไข · ลากจุดสีน้ำเงิน ● ที่ขอบสัญลักษณ์ไปวางบนสัญลักษณ์อื่นเพื่อสร้างลูกศร</span>`;
  }
  const palette = Object.keys(DRAW_SHAPES).map(k=>{
    const S = DRAW_SHAPES[k], C = DRAW_COLORS[k];
    return `<div class="dpal-item" data-shape="${k}" title="ลากไปวางบนพื้นที่วาด หรือคลิกเพื่อเพิ่ม">
      <svg viewBox="-3 -3 ${S.w+6} ${S.h+6}" preserveAspectRatio="xMidYMid meet">${drawShapeSvg(k, S.w, S.h, C.fill, C.stroke, 3)}</svg>
      <div class="dpal-name">${S.label}<small>${S.th}</small></div></div>`;
  }).join("");
  let check = "";
  if(t.showCheck){
    const a = drawAnalyze(), tips = [];
    if(a.shapeOk < a.shapeTotal) tips.push("ตรวจสอบว่าใส่ข้อความครบทุกขั้นตอน และใช้รูปสัญลักษณ์ตรงกับหน้าที่ของขั้นตอนนั้น (เช่น การรับข้อมูล/แสดงผลใช้รูปสี่เหลี่ยมด้านขนาน)");
    if(!a.decOk) tips.push("สัญลักษณ์ตัดสินใจ (◇) ต้องมีลูกศรออก 2 เส้น และกำหนดป้าย “ใช่” กับ “ไม่ใช่” ให้ครบ");
    if(!a.noJunk) tips.push("มีสัญลักษณ์ที่ยังไม่ได้เลือกข้อความ หรือใช้ข้อความที่ไม่ใช่หน้าที่ของระบบเตือนนี้");
    if(!a.flowOk) tips.push("ตรวจสอบทิศทางลูกศร: “เริ่มต้น” ต้องไม่มีลูกศรเข้า, “สิ้นสุด” ต้องไม่มีลูกศรออก และขั้นตอนอื่น (ยกเว้นจุดตัดสินใจ) มีลูกศรออกเพียง 1 เส้น");
    const done = !tips.length && a.edgeOk===a.edgeTotal;
    check = `<div class="dcheck${done?"":" warn"}"><b>${done?"✓ ผังงานสมบูรณ์ ครบถ้วนตามอัลกอริทึม":"ผลการตรวจสอบผังงาน"}</b><ul>
      <li>สัญลักษณ์ที่ใช้รูปทรงและข้อความถูกต้อง: ${a.shapeOk} / ${a.shapeTotal}</li>
      <li>ลูกศรเชื่อมต่อที่ถูกต้อง: ${a.edgeOk} / ${a.edgeTotal}</li>
      ${tips.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  }
  return `
  <div class="card">
    <div class="eyebrow">ขั้นตอนที่ 2 · LEARN — ภาระงานที่ 3 จาก 5</div>
    <h2>วางแผนงานด้วยผังงาน (Flowchart Editor)</h2>
    <p>ก่อนเขียนโปรแกรมจริง นักพัฒนาจะวางแผนงานด้วยผังงาน ให้คุณวาดผังงานของส่วน <b>“ตรวจสอบกำหนดเวลาพ่น”</b> ของระบบ:
      <b>ลากสัญลักษณ์</b>จากแถบด้านซ้ายมาวางบนพื้นที่วาด คลิกสัญลักษณ์เพื่อ<b>เลือกข้อความ</b> แล้ว<b>ลากจุดสีน้ำเงิน ●</b> ที่ขอบสัญลักษณ์ไปวางบนสัญลักษณ์ถัดไปเพื่อสร้างลูกศร ลูกศรที่ออกจากจุดตัดสินใจต้องกำหนดป้าย “ใช่” หรือ “ไม่ใช่”</p>
    <div class="ruleline"><b>เงื่อนไข:</b> อนุญาตให้พิจารณาพ่นได้เมื่อเว้นระยะห่างจากการพ่นครั้งล่าสุดอย่างน้อย 7 วัน มิฉะนั้นให้แสดงผลว่ายังไม่ถึงกำหนดพ่น</div>

    <div class="drawide" id="drawIde">
      <div class="dpalette"><div class="bpanel-title"><span>สัญลักษณ์ผังงาน</span></div>${palette}</div>
      <div>
        <div class="dtoolbar">${tool}<span class="dt-sep"></span>
          <button type="button" class="btn-ghost btn-sm" id="drawCheck">ตรวจสอบผังงาน</button>
          <button type="button" class="btn-ghost btn-sm" id="drawClear" ${t.nodes.length?"":"disabled"}>${t.confirmClear?"ยืนยันล้างทั้งหมด?":"ล้างทั้งหมด"}</button>
        </div>
        <div class="dcanvas-wrap" id="drawWrap" data-keepscroll>
          <div class="dcanvas" id="drawCanvas" style="width:${DRAW_W}px;height:${DRAW_H}px;">
            <svg class="dsvg" width="${DRAW_W}" height="${DRAW_H}">
              <defs>
                <marker id="dArrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A4A"/></marker>
                <marker id="dArrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/></marker>
              </defs>
              <g id="drawEdges">${drawEdgesInner()}</g>
              <line id="drawTemp" x1="0" y1="0" x2="0" y2="0" stroke="#1A73E8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dArrowSel)" style="display:none"/>

        <p class="small" style="margin:6px 0 0;">เคล็ดลับ: ลากสัญลักษณ์เพื่อย้ายตำแหน่ง · กดปุ่ม Delete เพื่อลบสิ่งที่เลือก · คลิกพื้นที่ว่างเพื่อยกเลิกการเลือก</p>

/* ---------------- Learn Task 5: resistance-risk analysis chart ---------------- */
function computeMoaStats(){
  const groups = ["A","B","C"];
  const stats = {};
  groups.forEach(g=>{ stats[g] = {correct:0, fn:0, fp:0}; });
  T5_DATA.forEach(r=>{
    const fn = !r.warned && r.actual;
    const fp = r.warned && !r.actual;
    if(fn) stats[r.moa].fn++;
    else if(fp) stats[r.moa].fp++;
    else stats[r.moa].correct++;
  });
  return {groups, stats};
}

function renderLearn5(){
  const t = state.learn.t5;
  const {groups, stats} = computeMoaStats();
  const maxCount = Math.max(...groups.map(g=>Math.max(stats[g].correct, stats[g].fn, stats[g].fp)), 1);
  const sel = t.selectedGroup;

  const rows = T5_DATA.map(r=>{
    const fn = !r.warned && r.actual;
    const fp = r.warned && !r.actual;
    const hl = sel && r.moa===sel;
    return `<tr class="${hl?'rowhighlight':''}">
      <td>${r.no}</td><td>${r.days}</td><td>กลุ่ม ${r.moa}</td>

    </tr>`;
  }).join("");

  return `

    </div>

    <div class="chartlegend">

      <span><i style="background:var(--amber);"></i> ผลบวกลวง</span>
    </div>
    <div class="bargroup-chart">
      ${groups.map(g=>`
        <div class="bargroup ${sel===g?'selected':''}">
          <div class="bars">
            <div class="bar correct" style="height:${(stats[g].correct/maxCount)*100}px;"><span class="val">${stats[g].correct}</span></div>
            <div class="bar fn" style="height:${(stats[g].fn/maxCount)*100}px;"><span class="val">${stats[g].fn}</span></div>

async function loadHistory(){
  const container = document.getElementById("historyContent");
  if(!container) return;
  try{
    const list = await window.storage.list(STORAGE_PREFIX, true);
    const keys = (list && list.keys) || [];
    if(keys.length===0){ container.innerHTML = "<p class='small'>ยังไม่มีข้อมูลการทำแบบทดสอบ</p>"; return; }
    const records = [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) records.push(JSON.parse(r.value));
      }catch(e){}
    }
    records.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
    window.__spray_records = records;
    container.innerHTML = `
    <div class="historytable">
    <table>
      <tr><th>วันเวลา</th><th>ชื่อ</th><th>ระดับชั้น</th><th>Show</th><th>Learn</th><th>Apply</th><th>Reflect</th><th>รวม</th><th>ระดับ</th></tr>
      ${records.map(r=>`
        <tr>
          <td>${new Date(r.timestamp).toLocaleString("th-TH")}</td>
          <td style="text-align:left;">${r.user}</td>
          <td>${r.grade}</td>
          <td>${r.show}</td>
          <td>${r.learn}</td>
          <td>${r.apply}</td>
          <td>${r.reflect}</td>
          <td style="color:var(--leaf-dim);font-weight:700;">${r.overall}</td>
          <td>${r.level} — ${r.levelName}</td>
        </tr>`).join("")}
    </table>
    </div>`;
  }catch(e){
    container.innerHTML = "<p class='small' style='color:var(--red)'>ไม่สามารถโหลดข้อมูลได้</p>";
  }
}

function exportCsv(){
  const records = window.__spray_records || [];
  const header = ["timestamp","user","grade","show","learn","learn_task1","learn_task2","learn_task3","learn_task4","learn_task5","apply","reflect","overall","level","levelName"];
  const lines = [header.join(",")];
  records.forEach(r=>{
    lines.push([
      r.timestamp, r.user, r.grade, r.show, r.learn,
      r.learn_detail? r.learn_detail.task1:"", r.learn_detail? r.learn_detail.task2:"", r.learn_detail? r.learn_detail.task3:"", r.learn_detail? r.learn_detail.task4:"", r.learn_detail? r.learn_detail.task5:"",
      r.apply, r.reflect, r.overall, r.level, r.levelName
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "smartspray_results.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   DRAG & DROP ENGINE — pointer events (รองรับทั้งเมาส์และหน้าจอสัมผัส)
   ใช้ร่วมกันระหว่างภาระงานที่ 2 (บล็อกคำสั่ง) และภาระงานที่ 3 (ผังงาน)
   ============================================================ */
let DRAG = null;
function initDragEngine(){
  if(window.__ssDragInit) return;
  window.__ssDragInit = true;
  document.addEventListener("pointerdown", onDragDown);
  document.addEventListener("pointermove", onDragMove, {passive:false});
  document.addEventListener("pointerup", onDragUp);
  document.addEventListener("pointercancel", onDragCancel);
  document.addEventListener("keydown", onDrawKey);
}
function onDragDown(e){
  if(e.pointerType==="mouse" && e.button!==0) return;
  const tg = e.target;
  if(!tg || !tg.closest) return;
  const base = {sx:e.clientX, sy:e.clientY, started:false};
  if(tg.closest("#blockIde")){
    if(tg.closest(".sb-del")) return;
    const blk = tg.closest(".sblock");
    if(!blk) return;
    e.preventDefault();
    DRAG = Object.assign(base, {kind:"block", src:blk.dataset.src, btype:blk.dataset.btype, uid:blk.dataset.uid||null, el:blk});
    return;
  }
  if(tg.closest("#drawIde")){
    const t3 = state.learn.t3;
    const pal = tg.closest(".dpal-item");
    if(pal){ e.preventDefault(); DRAG = Object.assign(base, {kind:"shape", shape:pal.dataset.shape, el:pal}); return; }
    const h = tg.closest(".dhandle");
    if(h){ e.preventDefault(); DRAG = Object.assign(base, {kind:"connect", from:h.dataset.handle}); return; }
    const nd = tg.closest(".dnode");
    if(nd){
      const n = drawNode(nd.dataset.node);
      if(!n) return;
      e.preventDefault();
      DRAG = Object.assign(base, {kind:"node", id:n.id, el:nd, ox:n.x, oy:n.y});
      return;
    }
    const ed = tg.closest("[data-edge]");
    if(ed){ e.preventDefault(); t3.selected = {kind:"edge", id:ed.getAttribute("data-edge")}; t3.confirmClear = false; render(); return; }
    if(tg.closest("#drawCanvas") && t3.selected){ t3.selected = null; render(); }
  }
}
function dragStartVisual(){
  const d = DRAG;
  if(d.kind==="block"){
    const r = d.el.getBoundingClientRect();
    const g = d.el.cloneNode(true);
    g.classList.add("drag-ghost");
    g.style.width = r.width+"px";
    document.body.appendChild(g);
    d.ghost = g; d.gx = d.sx - r.left; d.gy = d.sy - r.top;
    if(d.src==="script") d.el.classList.add("drag-src");
  } else if(d.kind==="shape"){
    const S = DRAW_SHAPES[d.shape], C = DRAW_COLORS[d.shape];
    const g = document.createElement("div");
    g.className = "drag-ghost";
    g.style.width = S.w+"px"; g.style.height = S.h+"px";
    g.innerHTML = `<svg width="${S.w}" height="${S.h}">${drawShapeSvg(d.shape, S.w, S.h, C.fill, "#1A73E8", 2)}</svg>`;
    document.body.appendChild(g);
    d.ghost = g; d.gx = S.w/2; d.gy = S.h/2;
  } else if(d.kind==="node"){
    state.learn.t3.selected = {kind:"node", id:d.id};
    document.querySelectorAll("#drawCanvas .dnode.sel").forEach(x=>x.classList.remove("sel"));
    d.el.classList.add("sel");
  }
}
/* หาช่องวางบล็อกที่ใกล้มุมบนซ้ายของบล็อกที่กำลังลากมากที่สุด */
function findBlockSlot(x, y){
  const area = document.getElementById("scriptArea");
  if(!area) return null;
  const ar = area.getBoundingClientRect();
  if(x < ar.left-40 || x > ar.right || y < ar.top-40 || y > ar.bottom+40) return null;
  let best = null, bestScore = Infinity;
  area.querySelectorAll(".bslot").forEach(s=>{
    if(DRAG.src==="script" && DRAG.el.contains(s)) return;
    if(!canDropBlock(DRAG.btype, s.dataset.list, parseInt(s.dataset.index), DRAG.uid)) return;
    const r = s.getBoundingClientRect();
    let score = Math.abs(y - (r.top + r.height/2));
    if(x < r.left - 6) score += (r.left - 6 - x) * 2;
    if(score < bestScore){ bestScore = score; best = s; }
  });
  return best;
}
function onDragMove(e){
  if(!DRAG) return;
  if(!DRAG.started){
    if(Math.abs(e.clientX-DRAG.sx) + Math.abs(e.clientY-DRAG.sy) < 5) return;
    DRAG.started = true;
    dragStartVisual();
  }
  e.preventDefault();
  const d = DRAG;
  if(d.ghost){ d.ghost.style.left = (e.clientX-d.gx)+"px"; d.ghost.style.top = (e.clientY-d.gy)+"px"; }
  if(d.kind==="block"){
    const slot = findBlockSlot(e.clientX-d.gx+12, e.clientY-d.gy);
    if(slot!==d.slot){ if(d.slot) d.slot.classList.remove("active"); d.slot = slot; if(slot) slot.classList.add("active"); }
  } else if(d.kind==="node"){
    const n = drawNode(d.id), S = DRAW_SHAPES[n.shape];
    n.x = Math.min(drawSnap(clamp(d.ox + e.clientX - d.sx, 0, DRAW_W-S.w)), DRAW_W-S.w);
    n.y = Math.min(drawSnap(clamp(d.oy + e.clientY - d.sy, 0, DRAW_H-S.h)), DRAW_H-S.h);
    d.el.style.left = n.x+"px"; d.el.style.top = n.y+"px";
    const g = document.getElementById("drawEdges");
    if(g) g.innerHTML = drawEdgesInner();
  } else if(d.kind==="connect"){
    const cv = document.getElementById("drawCanvas"), line = document.getElementById("drawTemp"), n = drawNode(d.from);
    if(!cv || !line || !n) return;
    const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
    const b = drawBoundary(n, px, py);
    line.setAttribute("x1", b.x); line.setAttribute("y1", b.y);
    line.setAttribute("x2", px);  line.setAttribute("y2", py);
    line.style.display = "";
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const tn = over && over.closest ? over.closest(".dnode") : null;
    document.querySelectorAll(".dnode.target").forEach(x=>{ if(x!==tn) x.classList.remove("target"); });
    if(tn && tn.dataset.node!==d.from) tn.classList.add("target");
  }
}
function onDragUp(e){
  if(!DRAG) return;
  const d = DRAG; DRAG = null;
  if(d.ghost) d.ghost.remove();
  document.querySelectorAll(".dnode.target").forEach(x=>x.classList.remove("target"));
  if(d.kind==="block") return dropBlock(d);
  if(d.kind==="shape") return dropShape(d, e);
  const t3 = state.learn.t3;
  if(d.kind==="node"){ t3.selected = {kind:"node", id:d.id}; t3.confirmClear = false; render(); return; }
  if(d.kind==="connect"){
    if(d.started){
      const over = document.elementFromPoint(e.clientX, e.clientY);
      const tn = over && over.closest ? over.closest(".dnode") : null;
      const to = tn ? tn.dataset.node : null;
      if(to && to!==d.from && !t3.edges.some(x=>x.from===d.from && x.to===to)){
        const id = "e"+(t3.seq++);
        t3.edges.push({id, from:d.from, to, label:""});
        t3.selected = {kind:"edge", id};
      }
    } else t3.selected = {kind:"node", id:d.from};
    t3.confirmClear = false;
    render();
  }
}
function onDragCancel(){
  if(!DRAG) return;
  if(DRAG.ghost) DRAG.ghost.remove();
  DRAG = null;
  render();
}
function dropBlock(d){
  const t2 = state.learn.t2;
  if(!d.started){                                   // คลิกบล็อกในชุดคำสั่ง = เพิ่มต่อท้ายสคริปต์
    if(d.src!=="palette") return;
    if(BLOCK_DEFS[d.btype].hat){ if(canDropBlock(d.btype, "root", 0, null)) t2.script.unshift(newBlock(d.btype)); }
    else t2.script.push(newBlock(d.btype));
  } else if(d.slot){
    const target = blockList(d.slot.dataset.list);
    let idx = parseInt(d.slot.dataset.index);
    if(!target){ render(); return; }
    let blk;
    if(d.src==="palette") blk = newBlock(d.btype);
    else {
      const loc = blockLoc(t2.script, d.uid);
      if(!loc){ render(); return; }
      blk = loc.list[loc.index];
      if(loc.list===target && loc.index < idx) idx--;
      loc.list.splice(loc.index, 1);
    }
    target.splice(idx, 0, blk);
  } else if(d.src==="script"){                      // ลากออกนอกพื้นที่สคริปต์ = ลบ
    const loc = blockLoc(t2.script, d.uid);
    if(loc) loc.list.splice(loc.index, 1);
  }
  t2.runs = {}; t2.confirmClear = false;
  render();
}
function dropShape(d, e){
  const t3 = state.learn.t3, S = DRAW_SHAPES[d.shape];
  const cv = document.getElementById("drawCanvas"), wrap = document.getElementById("drawWrap");
  if(!cv || !wrap) return;
  let x, y;
  if(d.started){
    const wr = wrap.getBoundingClientRect();
    if(e.clientX<wr.left || e.clientX>wr.right || e.clientY<wr.top || e.clientY>wr.bottom) return;
    const r = cv.getBoundingClientRect();
    x = e.clientX - r.left - S.w/2; y = e.clientY - r.top - S.h/2;
  } else {                                          // คลิกสัญลักษณ์ = วางไว้กลางพื้นที่ที่มองเห็น
    const k = t3.nodes.length % 6;
    x = wrap.scrollLeft + wrap.clientWidth/2 - S.w/2 + k*14;
    y = wrap.scrollTop + 30 + k*44;
  }
  x = Math.min(drawSnap(clamp(x, 0, DRAW_W-S.w)), DRAW_W-S.w);
  y = Math.min(drawSnap(clamp(y, 0, DRAW_H-S.h)), DRAW_H-S.h);
  const id = "n"+(t3.seq++);
  t3.nodes.push({id, shape:d.shape, x, y, textId:null});
  t3.selected = {kind:"node", id}; t3.confirmClear = false;
  render();
}
function onDrawKey(e){
  if(state.screen!=="learn3" || !state.learn.t3.selected) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if(["INPUT","SELECT","TEXTAREA"].indexOf(tag)>=0) return;
  if(e.key==="Delete" || e.key==="Backspace"){ e.preventDefault(); drawDeleteSelected(); render(); }
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachHandlers(){
  const btnStart = document.getElementById("btnStart");
  if(btnStart) btnStart.onclick = ()=>{
    const name = document.getElementById("inpName").value.trim();
    const grade = document.getElementById("inpGrade").value;
    if(!name || !grade){
      document.getElementById("loginError").textContent = "กรุณาป้อนชื่อและเลือกระดับชั้นก่อนเริ่มทำแบบทดสอบ";
      return;
    }
    state.user = name; state.grade = grade;
    state.remaining = TOTAL_SECONDS;
    state.finished = false;
    startTimer();
    goto("show");
  };
  const btnHistory = document.getElementById("btnHistory");
  if(btnHistory) btnHistory.onclick = ()=>{ goto("history"); loadHistory(); };

  const btnToggleSettings = document.getElementById("btnToggleSettings");
  if(btnToggleSettings) btnToggleSettings.onclick = ()=>{ state.showSettings = !state.showSettings; render(); };
  const webhookUrl = document.getElementById("webhookUrl");
  if(webhookUrl) webhookUrl.oninput = (e)=>{ state.config.draft = e.target.value; };
  const btnSaveWebhook = document.getElementById("btnSaveWebhook");
  if(btnSaveWebhook) btnSaveWebhook.onclick = ()=> saveConfig(state.config.draft.trim());
  const btnTestWebhook = document.getElementById("btnTestWebhook");
  if(btnTestWebhook) btnTestWebhook.onclick = testWebhook;
  const btnClearWebhook = document.getElementById("btnClearWebhook");
  if(btnClearWebhook) btnClearWebhook.onclick = ()=>{ state.config.draft=""; saveConfig(""); };

  document.querySelectorAll(".choicegroup").forEach(g=>{
    const name = g.dataset.name;
    g.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        if(name==="show_a1") state.show.a1 = inp.value;
        if(name==="show_a3") state.show.a3 = inp.value;
        if(name==="show_a4") state.show.a4 = inp.value;
        if(name==="show_a5") state.show.a5 = inp.value;
        if(name==="show_a2"){
          const val = inp.value;
          const arr = state.show.a2;
          if(inp.checked){ if(!arr.includes(val)) arr.push(val); }
          else{ state.show.a2 = arr.filter(v=>v!==val); }
        }
        render();
      });
    });
  });

  const btnToLearn = document.getElementById("btnToLearn");
  if(btnToLearn) btnToLearn.onclick = ()=> goto("learn1");

  document.querySelectorAll("[data-order-for]").forEach(sel=>{
    sel.onchange = (e)=>{ state.learn.t1.order[sel.dataset.orderFor] = parseInt(e.target.value); render(); };
  });
  const t1explain = document.getElementById("t1explain");
  if(t1explain) t1explain.oninput = (e)=>{ state.learn.t1.explain = e.target.value; };
  const btnBackShow = document.getElementById("btnBackShow");
  if(btnBackShow) btnBackShow.onclick = ()=> goto("show");
  const btnToLearn2 = document.getElementById("btnToLearn2");
  if(btnToLearn2) btnToLearn2.onclick = ()=> goto("learn2");

  /* ---- Learn Task 2: block coding ---- */
  document.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const loc = blockLoc(state.learn.t2.script, btn.dataset.del);
      if(loc) loc.list.splice(loc.index, 1);
      state.learn.t2.runs = {};
      render();
    };
  });
  document.querySelectorAll("[data-run]").forEach(btn=>{
    btn.onclick = ()=>{
      const t2 = state.learn.t2, sc = BLOCK_TESTS.find(x=>x.id===btn.dataset.run);
      t2.runs[sc.id] = runBlockProgram(t2.script, sc);
      t2.stageScenario = sc.id;
      render();
    };
  });
  const btnRunAllBlocks = document.getElementById("btnRunAllBlocks");
  if(btnRunAllBlocks) btnRunAllBlocks.onclick = ()=>{
    const t2 = state.learn.t2;
    BLOCK_TESTS.forEach(sc=>{ t2.runs[sc.id] = runBlockProgram(t2.script, sc); });
    const fail = BLOCK_TESTS.find(sc=>!t2.runs[sc.id].pass);
    t2.stageScenario = (fail || BLOCK_TESTS[BLOCK_TESTS.length-1]).id;
    render();
  };
  const btnClearScript = document.getElementById("btnClearScript");
  if(btnClearScript) btnClearScript.onclick = ()=>{
    const t2 = state.learn.t2;
    if(!t2.confirmClear){ t2.confirmClear = true; render(); return; }
    t2.script = []; t2.runs = {}; t2.confirmClear = false; render();
  };
  const btnBackToL1 = document.getElementById("btnBackToL1");
  if(btnBackToL1) btnBackToL1.onclick = ()=> goto("learn1");
  const btnToL3 = document.getElementById("btnToL3");
  if(btnToL3) btnToL3.onclick = ()=> goto("learn3");

  /* ---- Learn Task 3: flowchart editor ---- */
  const drawTextSel = document.getElementById("drawTextSel");
  if(drawTextSel) drawTextSel.onchange = (e)=>{
    const t3 = state.learn.t3, n = t3.selected && drawNode(t3.selected.id);
    if(n) n.textId = e.target.value || null;
    render();
  };
  document.querySelectorAll("[data-elabel]").forEach(btn=>{
    btn.onclick = ()=>{
      const t3 = state.learn.t3, ed = t3.selected && t3.edges.find(x=>x.id===t3.selected.id);
      if(ed) ed.label = btn.dataset.elabel;
      render();
    };
  });
  const drawReverse = document.getElementById("drawReverse");
  if(drawReverse) drawReverse.onclick = ()=>{
    const t3 = state.learn.t3, ed = t3.selected && t3.edges.find(x=>x.id===t3.selected.id);
    if(ed && !t3.edges.some(x=>x.from===ed.to && x.to===ed.from)){ const f = ed.from; ed.from = ed.to; ed.to = f; }
    render();
  };
  const drawDelete = document.getElementById("drawDelete");
  if(drawDelete) drawDelete.onclick = ()=>{ drawDeleteSelected(); render(); };
  const drawCheck = document.getElementById("drawCheck");
  if(drawCheck) drawCheck.onclick = ()=>{ state.learn.t3.showCheck = true; render(); };
  const drawClear = document.getElementById("drawClear");
  if(drawClear) drawClear.onclick = ()=>{
    const t3 = state.learn.t3;
    if(!t3.confirmClear){ t3.confirmClear = true; render(); return; }
    t3.nodes = []; t3.edges = []; t3.selected = null; t3.showCheck = false; t3.confirmClear = false; render();
  };
  const btnBackToL2 = document.getElementById("btnBackToL2");
  if(btnBackToL2) btnBackToL2.onclick = ()=> goto("learn2");
  const btnToL4 = document.getElementById("btnToL4");
  if(btnToL4) btnToL4.onclick = ()=> goto("learn4");


  const t4min = document.getElementById("t4min");
  if(t4min) t4min.oninput = (e)=>{ state.learn.t4.min = parseFloat(e.target.value)||0; render(); };
  const t4max = document.getElementById("t4max");
  if(t4max) t4max.oninput = (e)=>{ state.learn.t4.max = parseFloat(e.target.value)||0; render(); };
  const btnBackToL3 = document.getElementById("btnBackToL3");
  if(btnBackToL3) btnBackToL3.onclick = ()=> goto("learn3");
  const btnToL5 = document.getElementById("btnToL5");
  if(btnToL5) btnToL5.onclick = ()=> goto("learn5");

  const t5fn = document.getElementById("t5fn");
  if(t5fn) t5fn.oninput = (e)=>{ state.learn.t5.fn = e.target.value; };
  const t5fp = document.getElementById("t5fp");
  if(t5fp) t5fp.oninput = (e)=>{ state.learn.t5.fp = e.target.value; };
  const t5acc = document.getElementById("t5acc");
  if(t5acc) t5acc.oninput = (e)=>{ state.learn.t5.acc = e.target.value; };
  const t5worst = document.getElementById("t5worst");
  if(t5worst) t5worst.onchange = (e)=>{ state.learn.t5.worst = e.target.value; };
  document.querySelectorAll(".envtab").forEach(b=>{
    b.onclick = ()=>{ state.learn.t5.selectedGroup = b.dataset.env || null; render(); };
  });
  const btnBackToL4 = document.getElementById("btnBackToL4");
  if(btnBackToL4) btnBackToL4.onclick = ()=> goto("learn4");
  const btnToApply = document.getElementById("btnToApply");
  if(btnToApply) btnToApply.onclick = ()=> goto("apply");

  const applyMinInterval = document.getElementById("applyMinInterval");
  if(applyMinInterval) applyMinInterval.oninput = (e)=>{ state.apply.minInterval = parseInt(e.target.value); render(); };
  const applyConcTolerance = document.getElementById("applyConcTolerance");
  if(applyConcTolerance) applyConcTolerance.oninput = (e)=>{ state.apply.concTolerance = parseInt(e.target.value); render(); };
  const applyMaxConsecutive = document.getElementById("applyMaxConsecutive");
  if(applyMaxConsecutive) applyMaxConsecutive.oninput = (e)=>{ state.apply.maxConsecutive = parseInt(e.target.value); render(); };
  const btnRunApply = document.getElementById("btnRunApply");
  if(btnRunApply) btnRunApply.onclick = ()=> runApply();
  const tradeoff = document.getElementById("tradeoff");
  if(tradeoff) tradeoff.oninput = (e)=>{ state.apply.tradeoff = e.target.value; };
  const btnBackL3 = document.getElementById("btnBackL3");
  if(btnBackL3) btnBackL3.onclick = ()=> goto("learn5");
  const btnToReflect = document.getElementById("btnToReflect");
  if(btnToReflect) btnToReflect.onclick = ()=>{ if(state.apply.results) goto("reflect"); };

  document.querySelectorAll("[data-likert]").forEach(group=>{
    const name = group.dataset.likert;
    group.querySelectorAll("button").forEach(btn=>{
      btn.onclick = ()=>{ state.reflect[name] = parseInt(btn.dataset.val); render(); };
    });
  });
  const reflectStrategy = document.getElementById("reflectStrategy");
  if(reflectStrategy) reflectStrategy.oninput = (e)=>{ state.reflect.strategy = e.target.value; };
  const reflectMore = document.getElementById("reflectMore");
  if(reflectMore) reflectMore.oninput = (e)=>{ state.reflect.more = e.target.value; };
  const btnBackApply = document.getElementById("btnBackApply");
  if(btnBackApply) btnBackApply.onclick = ()=> goto("apply");
  const btnFinish = document.getElementById("btnFinish");
  if(btnFinish) btnFinish.onclick = ()=> finishTest(false);

  const btnViewHistory = document.getElementById("btnViewHistory");
  if(btnViewHistory) btnViewHistory.onclick = ()=>{ goto("history"); loadHistory(); };
  const btnRestart = document.getElementById("btnRestart");
  if(btnRestart) btnRestart.onclick = ()=>{ location.reload(); };

  const btnExportCsv = document.getElementById("btnExportCsv");
  if(btnExportCsv) btnExportCsv.onclick = exportCsv;
  const btnBackLogin = document.getElementById("btnBackLogin");
  if(btnBackLogin) btnBackLogin.onclick = ()=> goto("login");
}

async function initApp(){
  initDragEngine();
  render();
  await loadConfig();
  render();
}
initApp();
</script>
</body>
</html>
